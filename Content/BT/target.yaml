schema_version: "1.0"
behaviors:
  - name: captured
    when: is_captured
    tree:
      type: sequence
      children:
        - type: action
          name: stop
        - type: action
          name: deactivate_beacon

  - name: in_capture_range
    when: drone_in_capture_range
    tree:
      type: sequence
      children:
        - type: action
          name: stop
        - type: action
          name: pulse_beacon_fast
        - type: action
          name: increment_capture_timer

  - name: evading
    when: drone_in_fov
    tree:
      type: sequence
      children:
        - type: action
          name: set_speed_fast
        - type: action
          name: pulse_beacon_fast
        - type: action
          name: advance_along_path

  - name: patrol
    tree:
      type: sequence
      children:
        - type: action
          name: set_speed_normal
        - type: action
          name: pulse_beacon_slow
        - type: action
          name: advance_along_path
